[project]
name = "minihci"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "pydantic-settings",
    "prometheus-client>=0.26.0",
    "typer>=0.29.1",
    "httpx>=0.28.1",
]

[project.scripts]
minihci = "minihci.cli:app"

[project.optional-dependencies]
libvirt = ["libvirt-python"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "httpx",
    "pexpect",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minihci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: subprocess/crash tests (excluded by CHECK_FAST=1)",
    "real_hosts: needs real libvirt hosts (skipped unless MINIHCI_REAL_HOSTS is set)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom (x = Depends(...)) is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
