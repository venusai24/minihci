[project]
name = "minihci"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "pydantic-settings",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minihci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
